
<div class="min-h-screen bg-slate-50 pb-20">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white px-4 py-4">
    <div class="mx-auto flex max-w-lg items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-teal-600 text-sm font-bold text-white">
          C
        </div>
        <span class="font-bold text-slate-900">CleanOps</span>
      </div>
      <button
        type="button"
        class="text-sm text-slate-600"
        (click)="logout()"
      >
        Logout
      </button>
    </div>
  </header>

  <main class="px-4 py-6">
    <router-outlet />
  </main>

  <nav class="fixed bottom-0 left-0 right-0 border-t border-slate-200 bg-white">
    <div class="mx-auto flex max-w-lg justify-around py-2">
      <a
        routerLink="/cleaner/home"
        routerLinkActive="text-teal-600"
        class="flex flex-col items-center px-4 py-2 text-xs text-slate-500"
      >
        <span class="text-xl">🏠</span>
        Home
      </a>
      <a
        routerLink="/cleaner/history"
        routerLinkActive="text-teal-600"
        class="flex flex-col items-center px-4 py-2 text-xs text-slate-500"
      >
        <span class="text-xl">📋</span>
        History
      </a>
    </div>
  </nav>
</div>
