
<app-page-header
  title="Admin Dashboard"
  description="System-wide overview and analytics"
/>

@if (loading()) {
  <app-loading-spinner />
} @else if (error()) {
  <div class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">
    {{ error() }}
  </div>
  <button
    type="button"
    class="mt-4 rounded-lg bg-teal-600 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-700"
    (click)="loadAdminOverview()"
  >
    Try again
  </button>
} @else if (overview()) {
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    <app-stat-card label="Supervisors" [value]="overview()!.supervisorCount" icon="👔" />
    <app-stat-card label="Total Cleaners" [value]="overview()!.totalCleaners" icon="👥" />
    <app-stat-card label="Total Rooms" [value]="overview()!.roomCount" icon="🏨" />
    <app-stat-card label="Completion Rate" [value]="overview()!.completionRate + '%'" icon="📈" />
  </div>

  <div class="mt-8 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h3 class="text-lg font-semibold text-slate-900">System Health</h3>
    <div class="mt-4 grid gap-4 sm:grid-cols-3">
      <div class="rounded-lg bg-emerald-50 p-4">
        <p class="text-sm text-emerald-600">Active Users</p>
        <p class="text-2xl font-bold text-emerald-700">{{ overview()!.activeUsers }}</p>
      </div>
      <div class="rounded-lg bg-blue-50 p-4">
        <p class="text-sm text-blue-600">Tasks Today</p>
        <p class="text-2xl font-bold text-blue-700">{{ overview()!.totalRoomsAssigned }}</p>
      </div>
      <div class="rounded-lg bg-purple-50 p-4">
        <p class="text-sm text-purple-600">Pending Verifications</p>
        <p class="text-2xl font-bold text-purple-700">{{ overview()!.tasksAwaitingVerification }}</p>
      </div>
    </div>
  </div>
}
